<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="header">
    <h1 class="header__titulo">RECIPES</h1>
    <div class="header__busqueda">
      <img src="imagenes/Search.png" class="header__Lupa">
    </div>
    <div class="registro">
      <img src="imagenes/perfil.png" class="registro__perfil">
      <p class="registro__text">Registrarse</p>
      <p class="registro__text">Iniciar sesión</p>

  </div>

  <div class="portada">
    <img src="imagenes/10-platillos-de-comida-china 1.png" class="portada__img">

  <div class="menu">

    <h2 class="menu__titulo">CATEGORIAS</h2>
      <ul>
        <li class="menu__item">Pollo y carnes </li>
        <li class="menu__item">Sopas</li>

      <button class="menu__button">ver mas...</button>

      <ul>
        <li class="menu__item">Recetas faciles </li>
        <li class="menu__item">Dietas</li>
        <li class="menu__item">Saludables</li>
      </ul>
      <button class="menu__button">ver mas...</button>
  </div>

  <div>
    <div class="casera">
      <img src="imagenes/descarga (4).png" class="casera__img">
      <p>Comida casera</p>
    </div>
    <div class="tipica">
      <img src="imagenes/descarga (2).png" class="tipica__img">
      <p>Comidas tipicas</p>
    </div>
    <div class="mar">
      <img src="imagenes/descarga (3).png" class="mar__img">
      <p>Comida de mar</p>
    </div>
    <div class="postres">
      <img src="imagenes/descarga (5).png" class="postres__img">
      <p>Postres</p>
    </div>
  </div>
